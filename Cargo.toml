[package]
name = "nchant-flow"
version = "0.4.0"
description = "Open-source phoneme timing model for voice synthesis"
authors = [
    "Caleb Long <ccodaze@mailbox.org>",
]
license = "MIT"
edition = "2024"
keywords = ["voice", "synthesis", "timing", "phoneme", "linguistics"]
categories = ["multimedia::audio", "science"]

[dependencies]
# Core dependencies
serde = { version = "^1", features = ["derive"] }
serde_yaml = "^0.9"
thiserror = "^2"

# Optional: CLI dependencies
serde_json = { version = "^1", optional = true }
clap = { version = "^4", features = ["derive"], optional = true }

# Optional: Training dependencies
textgridde-rs = { version = "^0.1.4", optional = true }
rayon = { version = "^1", optional = true }
indicatif = { version = "^0.17", optional = true }

[features]
default = ["cli", "train"]
cli = ["dep:clap", "dep:serde_json"]
train = ["dep:textgridde-rs", "dep:rayon", "dep:indicatif"]

[[bin]]
name = "flow"
path = "src/bin/flow.rs"
required-features = ["cli"]
